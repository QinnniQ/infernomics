[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infernomics"
version = "0.1.0"
requires-python = ">=3.10"
description = "Experiments in LLM inference cost, latency, caching, retrieval, and evaluation"
license = "MIT"
dependencies = [
  "openai",
  "python-dotenv",
  "rich",
  "numpy",
  "pandas",
  "matplotlib",
  "streamlit",
  "altair",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
